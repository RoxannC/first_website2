<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>D3.js Bar Chart</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
  </head>
  <body>
    <h2>My Bar Chart</h2>
    <div id="chart"></div>

    <script>
      // Your data
      const data = [
        { name: "A", value: 1 },
        { name: "B", value: 5 },
        { name: "C", value: 8 },
        { name: "D", value: 10 },
      ];

      // Set chart dimensions
      const width = 600;
      const height = 400;
      const margin = {
        top: 20,
        right: 20,
        bottom: 50,
        left: 50,
      };

      const chartWidth = width - margin.left - margin.right;
      const chartHeight = height - margin.top - margin.bottom;

      // Create SVG
      const svg = d3
        .select("#chart")
        .append("svg")
        .attr("width", width)
        .attr("height", height);

      const chart = svg
        .append("g")
        .attr("transform", `translate(${margin.left}, ${margin.top})`);

      // X scale
      const x = d3
        .scaleBand()
        .domain(data.map((d) => d.name))
        .range([0, chartWidth])
        .padding(0.2);

      // Y scale
      const y = d3.scaleLinear().domain([0, 10]).range([chartHeight, 0]);

      // Draw bars
      chart
        .selectAll("rect")
        .data(data)
        .join("rect")
        .attr("x", (d) => x(d.name))
        .attr("y", (d) => y(d.value))
        .attr("width", x.bandwidth())
        .attr("height", (d) => chartHeight - y(d.value))
        .attr("fill", "steelblue");

      // Add X axis
      chart
        .append("g")
        .attr("transform", `translate(0, ${chartHeight})`)
        .call(d3.axisBottom(x));

      // Add Y axis
      chart.append("g").call(d3.axisLeft(y));

      // Add X-axis label
      chart
        .append("text")
        .attr("x", chartWidth / 2)
        .attr("y", chartHeight + 40)
        .attr("text-anchor", "middle")
        .attr("fill", "black")
        .text("Name");

      // Add Y-axis label
      chart
        .append("text")
        .attr("transform", "rotate(-90)")
        .attr("x", -chartHeight / 2)
        .attr("y", -35)
        .attr("text-anchor", "middle")
        .attr("fill", "black")
        .text("Value");
    </script>
  </body>
</html>
